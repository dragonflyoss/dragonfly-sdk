[package]
name = "dragonfly-client-request-e2e-driver"
description = "Drives the Rust client-request SDK for the e2e tests"
version = "0.1.0"
authors = ["The Dragonfly Developers"]
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
dragonfly-client-request = { path = "../../../../client-request/rust", features = ["preheat"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
http = "1"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
