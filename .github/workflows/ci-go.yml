name: CI (Go)

on:
  push:
    branches: [main, release-*]
    paths: ['client-request/go/**', 'test/e2e/**', '!test/e2e/driver/rust/**', '.github/workflows/ci-go.yml']
  pull_request:
    branches: [main, release-*]
    paths: ['client-request/go/**', 'test/e2e/**', '!test/e2e/driver/rust/**', '.github/workflows/ci-go.yml']

defaults:
  run:
    working-directory: client-request/go

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        module: [client-request/go, test/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run gofmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: |
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: client-request/go/go.mod
          cache-dependency-path: client-request/go/go.sum

      - name: Run go build
        run: |
          go build ./...

      - name: Run go test
        run: |
          go test -race ./...
