name: CI (Python)

on:
  push:
    branches: [main, release-*]
    paths: ['python/**', '.github/workflows/ci-python.yml']
  pull_request:
    branches: [main, release-*]
    paths: ['python/**', '.github/workflows/ci-python.yml']

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run mypy
        run: |
          mypy src

  test:
    name: Test (Python ${{ matrix.python-version }})
    # setup-python has no 3.9 builds for the current ubuntu-latest image (26.04),
    # and the package still claims support for 3.9, so the matrix runs on 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run tests
        run: |
          pytest -q -m "not integration"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/dragonfly-sdk-check
          /tmp/dragonfly-sdk-check/bin/pip install dist/*.whl
          /tmp/dragonfly-sdk-check/bin/python -c "import dragonfly_sdk; print(dragonfly_sdk.__version__)"
