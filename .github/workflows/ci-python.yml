name: CI (Python)

on:
  push:
    branches: [main, release-*]
    paths: ['client-request/python/**', '.github/workflows/ci-python.yml']
  pull_request:
    branches: [main, release-*]
    paths: ['client-request/python/**', '.github/workflows/ci-python.yml']

defaults:
  run:
    working-directory: client-request/python

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: client-request/python/uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run mypy
        run: |
          uv run mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: client-request/python/uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run pytest
        run: |
          uv run pytest

      - name: Build package
        run: |
          uv build
