name: CI (Rust)

on:
  push:
    branches: [main, release-*]
    paths: ['client-request/rust/**', 'test/e2e/driver/rust/**', '.github/workflows/ci-rust.yml']
  pull_request:
    branches: [main, release-*]
    paths: ['client-request/rust/**', 'test/e2e/driver/rust/**', '.github/workflows/ci-rust.yml']

defaults:
  run:
    working-directory: client-request/rust

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        workspace: [client-request/rust, test/e2e/driver/rust]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: 1.88.0

      - name: Run cargo fmt
        run: |
          cargo fmt --all -- --check

      - name: Run cargo clippy
        run: |
          cargo clippy --all --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-request/rust
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Run cargo test
        run: |
          cargo test --all-features
