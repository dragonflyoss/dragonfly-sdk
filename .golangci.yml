version: '2'

run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocyclo
    - govet
    - misspell
    - staticcheck
  settings:
    gocyclo:
      min-complexity: 100
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(d7y.io/dragonfly-sdk)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
