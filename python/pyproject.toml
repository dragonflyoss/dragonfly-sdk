[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragonfly-sdk"
version = "0.1.0"
description = "Python SDK for Dragonfly, wrapping the dfget download client for developers."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Dragonfly Authors" }]
requires-python = ">=3.9"
dependencies = [
    "dragonfly-api>=2.3.0",
    "grpcio>=1.76.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://d7y.io"
Repository = "https://github.com/dragonflyoss/dragonfly-sdk"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["dragonfly_sdk"]
